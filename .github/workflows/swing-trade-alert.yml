name: Swing-Trade Telegram Alert

on:
  schedule:
    # 06:17 UTC, Mon-Fri (Boersentage) - vor US-Markteroeffnung, nach EU-Handelsstart
    - cron: "17 6 * * 1-5"
  workflow_dispatch: {}

jobs:
  swing-trade-alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run swing_trade watchlist scan and notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m swing_trade watchlist.csv --notify

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swing-trade-report
          path: reports/*.md
          retention-days: 30
